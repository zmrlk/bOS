name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test suite (guard payloads, bus schema, hooks, roster, clean-clone)
        run: bash tests/run.sh
      - name: Roster matches disk
        run: bash scripts/bos-roster.sh

  # Experimental: Git Bash on Windows. Symlinks and BSD/GNU tool gaps are
  # known unknowns — failures here don't block a release yet.
  test-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - run: git config --global core.symlinks true
      - uses: actions/checkout@v4
      - name: Test suite (Git Bash, experimental)
        shell: bash
        run: bash tests/run.sh
